      SOURCE_MAP_MAX_FILES_PER_REQUEST: "50"
      SOURCE_MAP_MAX_FILE_SIZE_BYTES: "52428800"
      SOURCE_MAP_MAX_MAPS_PER_RELEASE: "1000"
      SOURCE_MAP_RETENTION_DAYS: "90"
      STATUS_PAGE_CNAME_RECORD: "${HOST:?}"
      SUBSCRIPTION_PLAN_BASIC: "Basic,priceMonthlyId,priceYearlyId,0,0,1,0"
      SUBSCRIPTION_PLAN_ENTERPRISE: "Enterprise,priceMonthlyId,priceYearlyId,-1,-1,4,14"
      SUBSCRIPTION_PLAN_GROWTH: "Growth,priceMonthlyId,priceYearlyId,0,0,2,14"
      SUBSCRIPTION_PLAN_SCALE: "Scale,priceMonthlyId,priceYearlyId,0,0,3,0"
      TRUSTED_GEO_CITY_HEADER: ""
      TRUSTED_GEO_COUNTRY_HEADER: ""
      TRUSTED_GEO_REGION_HEADER: ""
      TRUSTED_PROXY_HOPS: "2"
      VALKEY_DB: "0"
      VALKEY_HOST: "valkey"
      VALKEY_IP_FAMILY: ""
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:?}"
      VALKEY_PORT: "6379"
      VALKEY_TLS_CA: ""
      VALKEY_TLS_SENTINEL_MODE: "false"
      VALKEY_USERNAME: "default"
      VAPID_PRIVATE_KEY: ""
      VAPID_PUBLIC_KEY: ""
      VAPID_SUBJECT: "mailto:support@oneuptime.com"
      VERCEL_MARKETPLACE_CLIENT_ID: ""
      VERCEL_MARKETPLACE_CLIENT_SECRET: ""
      WATCHED_TABLES_INCLUDED_PER_PROJECT: "100"
      WATCHED_TABLE_PRICE_IN_USD: "1"
      WATCHED_TABLE_STRIPE_PRICE_ID: ""
      WATCHED_TABLE_VOLUME_PRICE_IN_USD: "0.25"
      WATCHED_TABLE_VOLUME_THRESHOLD: "1000"
      WORKFLOW_SCRIPT_TIMEOUT_IN_MS: "5000"
      WORKFLOW_TIMEOUT_IN_MS: "120000"
      ZOOM_APP_CLIENT_ID: ""
      ZOOM_APP_CLIENT_SECRET: ""
      ZOOM_APP_WEBHOOK_SECRET_TOKEN: ""
    image: "oneuptime/nginx:${APP_TAG:-14.0.107}"
    logging:
      driver: "json-file"
      options:
        max-size: "1000m"
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_fin_timeout: "15"
      net.ipv4.tcp_tw_reuse: "1"
    depends_on:
      clickhouse:
        condition: "service_healthy"
        required: true
      postgres:
        condition: "service_healthy"
        required: true
      valkey:
        condition: "service_healthy"
        required: true
  postgres:
    restart: "always"
    environment:
      POSTGRES_DB: "oneuptimedb"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?}"
      POSTGRES_USER: "postgres"
    image: "postgres:15"
    labels:
      docker-volume-backup.archive-pre: "/bin/sh -c 'pg_dump -U \"$$POSTGRES_USER\" -Fc \"$$POSTGRES_DB\" > /dumps/oneuptime.dump'"
      docker-volume-backup.exec-label: "${BACKUP_SCOPE:-oneuptime}-postgres"
    logging:
      driver: "json-file"
      options:
        max-size: "1000m"
    volumes:
      - "postgres:/var/lib/postgresql/data"
      - "postgres-dump:/dumps"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
      timeout: "5s"
      interval: "10s"
      retries: 5
      start_period: "15s"
  probe-1:
    restart: "always"
    cap_add:
      - "CHOWN"
      - "DAC_OVERRIDE"
      - "KILL"
      - "NET_RAW"
      - "SETGID"
      - "SETUID"
    cap_drop:
      - "ALL"
    environment:
      BILLING_ENABLED: "false"
      DISABLE_TELEMETRY: "true"
      ENABLE_PROFILING: "false"
      HTTPS_PROXY_URL: ""
      HTTP_PROXY_URL: ""
      LOG_LEVEL: "ERROR"
      NODE_ENV: "production"
      NO_PROXY: ""
      ONEUPTIME_URL: "https://${HOST:?}"
      OPENTELEMETRY_EXPORTER_OTLP_ENDPOINT: ""
      OPENTELEMETRY_EXPORTER_OTLP_HEADERS: ""
      PORT: "3874"
      PROBE_ALLOW_PRIVATE_NETWORK_MONITORS: "false"
      PROBE_CUSTOM_CODE_MONITOR_SCRIPT_TIMEOUT_IN_MS: "60000"
      PROBE_DESCRIPTION: "Global probe to monitor oneuptime resources"
      PROBE_KEY: "${GLOBAL_PROBE_1_KEY:?}"
      PROBE_MONITORING_WORKERS: "5"
      PROBE_MONITOR_FETCH_LIMIT: "10"
      PROBE_NAME: "Probe-1"
      PROBE_NETWORK_DEVICE_POLL_CONCURRENCY: ""
      PROBE_SNMP_GET_CHUNK_SIZE: ""
      PROBE_SYNTHETIC_MONITOR_CHROMIUM_SANDBOX_ENABLED: "true"
      PROBE_SYNTHETIC_MONITOR_MAX_CONCURRENCY: "4"
      PROBE_SYNTHETIC_MONITOR_MAX_DISK_BYTES: "268435456"
      PROBE_SYNTHETIC_MONITOR_MAX_PROCESS_TREE_RSS_BYTES: "1610612736"
      PROBE_SYNTHETIC_MONITOR_SCRIPT_TIMEOUT_IN_MS: "60000"
      REGISTER_PROBE_KEY: "${REGISTER_PROBE_KEY:?}"
    image: "oneuptime/probe:${APP_TAG:-14.0.107}"
    logging:
      driver: "json-file"
      options:
        max-size: "1000m"
    network_mode: "host"
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./packages/Probe/seccomp_profile.json"
    shm_size: "536870912"
    depends_on:
      clickhouse:
        condition: "service_healthy"
        required: true
      postgres:
        condition: "service_healthy"
        required: true
      valkey:
        condition: "service_healthy"
        required: true
  valkey:
    restart: "always"
    command:
      - "valkey-server"
      - "--requirepass"
      - "${VALKEY_PASSWORD:?}"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    environment:
      VALKEY_PASSWORD: "${VALKEY_PASSWORD:?}"
    image: "valkey/valkey:9.1-alpine"
    logging:
      driver: "json-file"
      options:
        max-size: "1000m"
    healthcheck:
      test:
        - "CMD"
        - "valkey-cli"
        - "-a"
        - "${VALKEY_PASSWORD:?}"
        - "ping"
      timeout: "5s"
      interval: "10s"
      retries: 5
      start_period: "10s"
volumes:
  clickhouse: {}
  postgres: {}
  postgres-dump: {}
